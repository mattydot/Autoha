name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already has the Android SDK (ANDROID_HOME); Gradle fetches any missing platform

      - name: Install and sync web assets
        run: |
          npm ci
          npm run build:web
          npx cap sync android

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(node -p "require('./package.json').version")"; fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      # Release signing is optional: add the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to get a Play-ready signed bundle. Without them the
      # workflow still produces an installable debug-signed APK.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/AutobahnRush.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/AutobahnRush.aab"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/AutobahnRush.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AutobahnRush-${{ env.VERSION_NAME }}
          path: |
            ${{ runner.temp }}/AutobahnRush.apk
            ${{ runner.temp }}/AutobahnRush.aab
          if-no-files-found: ignore

      # A tag or a published release uploads the APK to that release. On main, a release
      # v<package.json version> is created once, so bumping the version in package.json ships a new release.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION_NAME"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && TAG="$GITHUB_REF_NAME"
          FILES="$RUNNER_TEMP/AutobahnRush.apk"; [ -f "$RUNNER_TEMP/AutobahnRush.aab" ] && FILES="$FILES $RUNNER_TEMP/AutobahnRush.aab"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/heads/* ]]; then echo "$TAG already released; bump the version in package.json for a new release"; exit 0; fi
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "Autobahn Rush $VERSION_NAME" --notes-file .github/release-notes.md
          fi
